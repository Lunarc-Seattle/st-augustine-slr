[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "st-augustine-slr"
version = "1.1.0"
description = "Reproducible sea-level-rise exposure pipeline for St. Augustine, Florida"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jie Yin" }]
requires-python = ">=3.12"
# Exact pins live in requirements.txt; these are the supported ranges.
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "osmnx>=2.0",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
slr = "slr.cli:main"

[project.urls]
Homepage = "https://lunarc-seattle.github.io/st-augustine-slr/"
Repository = "https://github.com/Lunarc-Seattle/st-augustine-slr"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["slr"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
